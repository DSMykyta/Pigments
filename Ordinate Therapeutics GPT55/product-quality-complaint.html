<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Quality Complaint | Ordinate Therapeutics</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body data-page="safety">
  <div data-site-header></div>
  <main class="page">
    <header class="page-title">
      <div class="eyebrow">Quality</div>
      <h1>Product Quality Complaint</h1>
      <p>Report suspected quality issues including damaged packaging, incorrect labeling, batch anomalies, device problems or storage excursions.</p>
    </header>
    <form class="panel" data-form-type="quality-complaint">
      <div class="control-grid">
        <div class="field"><label>Product name</label><input name="product" required></div>
        <div class="field"><label>Batch / lot number</label><input name="batch" required></div>
        <div class="field"><label>Country</label><input name="country" required></div>
        <div class="field"><label>Reporter email</label><input name="email" type="email" required></div>
      </div>
      <div class="control-grid" style="margin-top:14px">
        <div class="field"><label>Complaint type</label><select name="type" required><option value="">Select</option><option>Packaging defect</option><option>Labeling concern</option><option>Temperature excursion</option><option>Device failure</option><option>Suspected counterfeit</option><option>Other</option></select></div>
        <div class="field"><label>Product available for return</label><select name="available"><option>Unknown</option><option>Yes</option><option>No</option></select></div>
        <div class="field"><label>Adverse event also occurred</label><select name="ae"><option>Unknown</option><option>Yes</option><option>No</option></select></div>
        <div class="field"><label>Access pathway</label><select name="access"><option>Unknown</option><option>Pharmacy</option><option>Prescription</option><option>Hospital</option><option>Institutional</option></select></div>
      </div>
      <div class="field" style="margin-top:14px"><label>Complaint description</label><textarea name="description" required></textarea></div>
      <div class="form-actions" style="margin-top:14px"><button class="btn primary" type="submit">Submit complaint</button><a class="btn danger" href="report-adverse-event.html">Adverse event report</a></div>
      <div data-form-result></div>
    </form>
  </main>
  <div data-site-footer></div>
</body>
</html>
