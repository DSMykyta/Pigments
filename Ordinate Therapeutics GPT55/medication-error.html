<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medication Error | Ordinate Therapeutics</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body data-page="safety">
  <div data-site-header></div>
  <main class="page">
    <header class="page-title">
      <div class="eyebrow">Safety</div>
      <h1>Medication Error Report</h1>
      <p>Report wrong product, dose, route, timing, patient, documentation or access pathway errors.</p>
    </header>
    <form class="panel" data-form-type="medication-error">
      <div class="control-grid">
        <div class="field"><label>Product involved</label><input name="product" required></div>
        <div class="field"><label>Error type</label><select name="errorType" required><option value="">Select</option><option>Wrong product</option><option>Wrong dose</option><option>Wrong route</option><option>Wrong timing</option><option>Wrong patient</option><option>Missed dose</option><option>Incorrect access pathway</option><option>Other</option></select></div>
        <div class="field"><label>Country</label><input name="country" required></div>
        <div class="field"><label>Reporter email</label><input name="email" type="email" required></div>
      </div>
      <div class="control-grid" style="margin-top:14px">
        <div class="field"><label>Patient harm</label><select name="harm"><option>Unknown</option><option>No harm</option><option>Temporary harm</option><option>Serious harm</option></select></div>
        <div class="field"><label>Pigment medicine involved</label><select name="pigment"><option>Unknown</option><option>Yes</option><option>No</option></select></div>
        <div class="field"><label>Unexpected activation/blockade</label><select name="activation"><option>Unknown</option><option>Activation</option><option>Blockade</option><option>Neither</option></select></div>
        <div class="field"><label>Setting</label><select name="setting"><option>Home</option><option>Clinic</option><option>Hospital</option><option>Institution</option><option>Other</option></select></div>
      </div>
      <div class="field" style="margin-top:14px"><label>Error narrative</label><textarea name="description" required></textarea></div>
      <div class="form-actions" style="margin-top:14px"><button class="btn primary" type="submit">Submit report</button></div>
      <div data-form-result></div>
    </form>
  </main>
  <div data-site-footer></div>
</body>
</html>
