<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exposure Registry | Ordinate Therapeutics</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body data-page="safety">
  <div data-site-header></div>
  <main class="page">
    <header class="page-title">
      <div class="eyebrow">Registry</div>
      <h1>Pregnancy / Pediatric Exposure Registry</h1>
      <p>Submit pregnancy, pediatric or adolescent exposure information for pharmacovigilance follow-up.</p>
    </header>
    <form class="panel" data-form-type="exposure-registry">
      <div class="control-grid">
        <div class="field"><label>Exposure type</label><select name="type" required><option value="">Select</option><option>Pregnancy exposure</option><option>Pediatric exposure</option><option>Adolescent pigment medicine exposure</option><option>Breastfeeding exposure</option></select></div>
        <div class="field"><label>Product</label><input name="product" required></div>
        <div class="field"><label>Country</label><input name="country" required></div>
        <div class="field"><label>Reporter email</label><input name="email" type="email" required></div>
      </div>
      <div class="control-grid" style="margin-top:14px">
        <div class="field"><label>Gestational age / age</label><input name="age"></div>
        <div class="field"><label>Pigment carrier status</label><select name="status"><option>Unknown</option><option>Carrier</option><option>Non-pigment</option><option>Exposed by proximity</option></select></div>
        <div class="field"><label>Suppressor involved</label><select name="suppressor"><option>Unknown</option><option>Yes</option><option>No</option></select></div>
        <div class="field"><label>Activation incident</label><select name="activation"><option>Unknown</option><option>Yes</option><option>No</option></select></div>
      </div>
      <div class="field" style="margin-top:14px"><label>Exposure details</label><textarea name="details" required></textarea></div>
      <div class="form-actions" style="margin-top:14px"><button class="btn primary" type="submit">Submit registry entry</button></div>
      <div data-form-result></div>
    </form>
  </main>
  <div data-site-footer></div>
</body>
</html>
